    <style>

    <!-- Cookie consent banner -->
    <div id="cookie-banner" style="display:none" role="dialog" aria-live="polite">
      <div class="content">
        האתר משתמש בעוגיות לצורך ניתוח ביצועים ושיפור החוויה. האם לאשר שימוש ב‑Google Analytics?

      </div>
      <div class="actions">

        <button class="accept" id="cookie-accept">לאשר</button>
      </div>
    </div>
    <!-- End cookie banner -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Cookie banner logic
      (function(){
        const banner = document.getElementById('cookie-banner');
        const acceptBtn = document.getElementById('cookie-accept');
        const rejectBtn = document.getElementById('cookie-reject');
        const STORAGE_KEY = 'site_cookie_consent';

        function setConsentGranted(){
          try{
            // Update gtag consent and dataLayer for GTM
            if (typeof gtag === 'function'){
              gtag('consent','update',{
                'analytics_storage':'granted',
                'ad_storage':'granted'
              });
            }
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
              'event':'consent_update',
              'gtm.consent':{
                'ad_storage':'granted',
                'analytics_storage':'granted'
              }
            });
            localStorage.setItem(STORAGE_KEY,'granted');
          }catch(e){console.warn('Consent accept error',e)}
        }
        function setConsentDenied(){
          try{
            if (typeof gtag === 'function'){
              gtag('consent','update',{
                'analytics_storage':'denied',
                'ad_storage':'denied'
              });
            }
            window.dataLayer = window.dataLayer || [];
            window.dataLayer.push({
              'event':'consent_update',
              'gtm.consent':{
                'ad_storage':'denied',
                'analytics_storage':'denied'
              }
            });
            localStorage.setItem(STORAGE_KEY,'denied');
          }catch(e){console.warn('Consent reject error',e)}
        }

        // On load: check stored preference
        document.addEventListener('DOMContentLoaded', function(){
          try{
            const pref = localStorage.getItem(STORAGE_KEY);
            if(pref === 'granted'){
              // apply granted consent
              setConsentGranted();
              banner.style.display = 'none';
            } else if(pref === 'denied'){
              setConsentDenied();
              banner.style.display = 'none';
            } else {
              // show banner
              banner.style.display = 'flex';
            }
          }catch(e){
            // if localStorage blocked, still show banner
            banner.style.display = 'flex';
          }
        });

        acceptBtn && acceptBtn.addEventListener('click', function(){
          setConsentGranted();
          banner.style.display = 'none';
        });
        rejectBtn && rejectBtn.addEventListener('click', function(){
          setConsentDenied();
          banner.style.display = 'none';
        });
      })();
    </script>
  </body>
