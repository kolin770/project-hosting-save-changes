<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>לב-טק | אתר בתהליך תחזוקה</title>
    <meta name="description" content="האתר של לב-טק טכנולוגיות בתהליך תחזוקה. נודיע כשניפתח מחדש." />
    <style>
      :root {
        --bg: #07141f;
        --bg-2: #0d1d2d;
        --panel: rgba(14, 25, 36, 0.9);
        --panel-border: rgba(255,255,255,0.08);
        --text: #edf3ff;
        --muted: #b6c8dd;
        --muted-2: #8aa0b8;
        --accent: #d4af5d;
        --accent-2: #7bc0ff;
        --shadow: rgba(0, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at top, rgba(123, 192, 255, 0.12), transparent 32%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .container {
        width: min(860px, 100%);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        box-shadow: 0 28px 72px var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 28px 10px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
      }

      .logo-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #f2dca1 55%, #fff7db 100%);
        display: grid;
        place-items: center;
        color: #0a1a2d;
        font-weight: 900;
        font-size: 1.05rem;
        box-shadow: 0 12px 28px rgba(212, 175, 93, 0.25);
      }

      .brand-name {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      .content {
        padding: 28px 36px 34px;
        text-align: center;
      }

      .tag {
        display: inline-block;
        margin-bottom: 18px;
        padding: 9px 16px;
        border-radius: 999px;
        border: 1px solid rgba(212, 175, 93, 0.4);
        background: rgba(212, 175, 93, 0.08);
        color: var(--accent);
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 0.06em;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.3rem, 5vw, 4rem);
        line-height: 1.1;
      }

      .lead {
        margin: 0 auto;
        max-width: 620px;
        font-size: 1.12rem;
        line-height: 1.9;
        color: var(--muted);
      }

      .info {
        margin-top: 26px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 14px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        font-weight: 600;
      }

      .contact {
        margin-top: 24px;
        padding-top: 22px;
        border-top: 1px solid rgba(255,255,255,0.08);
        color: var(--muted-2);
        font-size: 0.97rem;
      }

      a {
        color: var(--accent-2);
        text-decoration: none;
      }

      a:hover { text-decoration: underline; }

      @media (max-width: 640px) {
        .content { padding: 22px 22px 28px; }
        .brand { padding: 9px 12px; }
        .brand-name { font-size: 1rem; }
        .lead { font-size: 1rem; }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="topbar">
        <div class="brand" aria-label="לב-טק לוגו">
          <div class="logo-mark">ל.ט</div>
          <div class="brand-name">לב-טק</div>
        </div>
      </div>

      <div class="content">
        <div class="tag">אתר בתהליך תחזוקה</div>
        <h1>נודיע כשניפתח מחדש</h1>
        <p class="lead">
          האתר של לב-טק טכנולוגיות נמצא כרגע בתהליך תחזוקה ושדרוגים.
          אנו עובדים על חוויית משתמש חדשה, ביצועים משופרים ותוכן עדכני.
          תודה על ההבנה וסבלנותכם.
        </p>

        <div class="info">
          <span class="pill">לב-טק טכנולוגיות</span>
          <span class="pill">שדרוגים בפיתוח</span>
          <span class="pill">נשוב בקרוב</span>
        </div>

        <div class="contact">
          למקרים דחופים, ניתן ליצור קשר בכתובת:<br>
          <a href="mailto:info@lev-tech.net">info@lev-tech.net</a>
        </div>
      </div>
    </main>
  </body>
</html>
